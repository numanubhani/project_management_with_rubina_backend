services:
  - type: web
    name: flowspace-backend
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn flowspace.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: flowspace-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://your-frontend-domain.vercel.app
      - key: ALLOWED_HOSTS
        value: project-management-with-rubina-backend.onrender.com

databases:
  - name: flowspace-db
    databaseName: flowspace
    user: flowspace_user


